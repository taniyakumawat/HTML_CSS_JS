<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern calculator built with HTML5, CSS3 and vanilla JavaScript.">
    <title>Calculator Fun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-label="Calculator">
        <!-- Display -->
        <section class="display" aria-live="polite">
            <span class="display__history" id="history"></span>
            <input
                class="display__value"
                id="displayValue"
                type="text"
                value="0"
                readonly
                autocomplete="off"
                spellcheck="false"
                aria-label="Calculator display">
        </section>

        <!-- Keypad -->
        <div class="keypad" id="keypad" role="group" aria-label="Calculator keypad">
            <button type="button" class="key key--fn" data-action="clear" aria-label="All clear">AC</button>
            <button type="button" class="key key--fn" data-action="back" aria-label="Delete last character">DEL</button>
            <button type="button" class="key key--op" data-value="%" aria-label="Percent">%</button>
            <button type="button" class="key key--op" data-value="/" aria-label="Divide">÷</button>

            <button type="button" class="key" data-value="7">7</button>
            <button type="button" class="key" data-value="8">8</button>
            <button type="button" class="key" data-value="9">9</button>
            <button type="button" class="key key--op" data-value="*" aria-label="Multiply">×</button>

            <button type="button" class="key" data-value="4">4</button>
            <button type="button" class="key" data-value="5">5</button>
            <button type="button" class="key" data-value="6">6</button>
            <button type="button" class="key key--op" data-value="-" aria-label="Minus">−</button>

            <button type="button" class="key" data-value="1">1</button>
            <button type="button" class="key" data-value="2">2</button>
            <button type="button" class="key" data-value="3">3</button>
            <button type="button" class="key key--op" data-value="+" aria-label="Plus">+</button>

            <button type="button" class="key" data-value="0">0</button>
            <button type="button" class="key" data-value="00">00</button>
            <button type="button" class="key" data-value=".">.</button>
            <button type="button" class="key key--eq" data-action="equals" aria-label="Equals">=</button>
        </div>

        <p class="hint">Tip: your keyboard works too &mdash; digits, operators, <kbd>Enter</kbd>, <kbd>Backspace</kbd>, <kbd>Esc</kbd>.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
